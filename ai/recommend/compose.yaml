# 추천 서비스 compose.
#
# 백엔드(backend/ai-block-clock/compose.yaml)가 만든 네트워크에 외부 네트워크로
# 참여한다. 그래야 백엔드가 컨테이너 이름으로 우리를 부를 수 있다.
#
#   백엔드에서 본 우리 주소 :  http://ai-block-clock-recommend:8100
#
# 백엔드 compose 는 네트워크에 name 을 주지 않아서 실제 이름에 프로젝트명 접두어가
# 붙는다(`ai-block-clock_ai-block-clock-network`). BACKEND_NETWORK 로 덮어쓸 수 있게
# 해 두고, CI 배포 잡이 실제 이름을 찾아 넣는다. (ai-runtime 과 같은 방식)
#
# 운영과 로컬의 차이는 환경변수뿐이라 compose.prod.yaml 을 따로 두지 않는다.
#   RECOMMEND_BIND     운영은 127.0.0.1 (백엔드만 부른다). 로컬 기본값은 0.0.0.0
#   ABC_MODEL_DIR      운영은 /opt/abc/models. 로컬은 ./models
#   ABC_INDEX_DIR      운영은 /opt/abc/index.  로컬은 ./index
#   ABC_SERVICE_TOKEN  운영은 반드시 채운다. 비면 인증 검사를 건너뛴다
#
# ★ 모델 가중치는 이미지에 없다. 423MB 라 이미지에 구우면 모델을 바꿀 때마다
#   전체를 다시 빌드·전송해야 한다. 호스트에 두고 볼륨으로 넣는다 (ai/.gitignore 규칙).
#
#   EC2 에 올리기
#     로컬> tar -czf model.tar.gz -C ai/recommend/models abc-agent-retriever-v1
#     로컬> scp -i <키> model.tar.gz ubuntu@j15a403.p.ssafy.io:~/
#     EC2>  sudo mkdir -p /opt/abc/models /opt/abc/index
#     EC2>  sudo tar -xzf ~/model.tar.gz -C /opt/abc/models
#
#   가중치를 안 넣으면 컨테이너가 **기동 단계에서 죽는다.** 의도한 동작이다.
#   HF_HUB_OFFLINE=1 이라 사전학습 모델을 받으러 가지 못하기 때문인데,
#   조용히 다른 모델로 도는 것보다 낫다 — 벡터 공간이 달라 추천이 미묘하게 어긋난다.
#
# 로컬에서 처음 띄울 때는 네트워크를 한 번 만들어 둔다.
#   docker network create ai-block-clock_ai-block-clock-network

services:
  recommend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-block-clock-recommend:${IMAGE_TAG:-local}
    container_name: ai-block-clock-recommend
    environment:
      # off | rrf | weighted — 시연 중 문제가 생기면 off 로 즉시 되돌린다 (09-17 측정)
      ABC_HYBRID: ${ABC_HYBRID:-weighted}
      ABC_SERVICE_TOKEN: ${ABC_SERVICE_TOKEN:-}
      ABC_SNAPSHOT_PATH: /app/index/index_snapshot.npz
    volumes:
      # 파인튜닝 가중치 — 읽기 전용. 서비스가 모델을 고칠 일은 없다
      - ${ABC_MODEL_DIR:-./models}:/app/models:ro
      # 인덱스 스냅샷 — 쓰기 필요. 컨테이너 밖에 둬야 재기동을 넘겨 살아남는다
      - ${ABC_INDEX_DIR:-./index}:/app/index
    ports:
      - "${RECOMMEND_BIND:-0.0.0.0}:${RECOMMEND_PORT:-8100}:8100"
    networks:
      - ai-block-clock-network
    restart: unless-stopped
    # 헬스체크는 Dockerfile 의 HEALTHCHECK 를 쓴다.
    # ai-runtime 처럼 curl 로 쓰지 않은 이유: slim 이미지에 curl 이 없어
    # 설치하면 용량만 는다. 대신 python 표준 라이브러리로 같은 것을 본다.

networks:
  ai-block-clock-network:
    external: true
    name: ${BACKEND_NETWORK:-ai-block-clock_ai-block-clock-network}
