<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>{{title}}</title>
<style>
  @font-face { font-family: "KR"; src: url("{{font_path}}"); }
  @page { size: A4; margin: 2cm 1.8cm; }
  body { font-family: "KR"; font-size: 10.5pt; line-height: 1.5; color: #222; }
  h1 { font-size: 20pt; margin: 0 0 4pt 0; }
  h2 { font-size: 14pt; margin: 18pt 0 6pt 0; border-bottom: 1px solid #999; padding-bottom: 2pt; }
  h3 { font-size: 12pt; margin: 14pt 0 4pt 0; }
  p { margin: 0 0 8pt 0; }
  .meta { color: #666; font-size: 9pt; margin-bottom: 14pt; }
  table { width: 100%; margin: 6pt 0 10pt 0; font-size: 9.5pt; }
  th, td { border: 1px solid #bbb; padding: 3pt 5pt; text-align: left; }
  th { background: #eee; }
  ul, ol { margin: 0 0 8pt 0; }
  li { margin-bottom: 2pt; }
  blockquote { margin: 6pt 0; padding: 4pt 10pt; border-left: 3px solid #999; color: #444; }
  code { font-family: "KR"; background: #f3f3f3; }
</style>
</head>
<body>
  <h1>{{title}}</h1>
  <div class="meta">생성일 {{date}} · ABC 선형 워크플로우 스파이크</div>
  {{body}}
</body>
</html>
