<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  @page { size: A4; margin: 1.6cm; }
  body { font-family: "KR", "Malgun Gothic", "Nanum Gothic", "Noto Sans KR", sans-serif; font-size: 10pt; line-height: 1.5; color: #1c1c1e; }
  .bar { border-bottom: 2px solid #1c1c1e; padding-bottom: 5pt; font-size: 9pt; color: #5f5e5a; }
  h1 { font-size: 21pt; margin: 14pt 0 12pt 0; line-height: 1.3; }
  .card { border: 1px solid #d8d8d4; padding: 8pt 10pt; margin: 0 0 8pt 0; }
  .card h2 { font-size: 9.5pt; letter-spacing: .06em; color: #5f5e5a; text-transform: uppercase; margin: 0 0 5pt 0; }
  ul { margin: 0; padding-left: 16pt; }
  li { margin-bottom: 2pt; }
  p { margin: 0 0 6pt 0; }
  .foot { margin-top: 14pt; font-size: 8pt; color: #888780; border-top: 1px solid #d8d8d4; padding-top: 5pt; }
</style>
</head>
<body>
  <div class="bar">ABC · {{ date }}</div>
  <h1>{{ title }}</h1>
  {% if text %}<div class="card">{{ text }}</div>{% endif %}
  {% for f in fields %}
  <div class="card">
    <h2>{{ f.key }}</h2>
    {{ f.html }}
  </div>
  {% endfor %}
  <div class="foot">AI 블록으로 만든 결과물 · 내용의 사실 확인은 사용자의 몫입니다</div>
</body>
</html>
