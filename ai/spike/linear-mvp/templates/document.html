<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  @page { size: A4; margin: 2cm 1.8cm; }
  body { font-family: "KR", "Malgun Gothic", "Nanum Gothic", "Noto Sans KR", sans-serif; font-size: 10.5pt; line-height: 1.55; color: #222; }
  h1 { font-size: 20pt; margin: 0 0 4pt 0; }
  h2 { font-size: 13pt; margin: 16pt 0 6pt 0; border-bottom: 1px solid #999; padding-bottom: 2pt; }
  p { margin: 0 0 8pt 0; }
  .meta { color: #666; font-size: 9pt; margin-bottom: 14pt; }
  ul { margin: 0 0 8pt 0; padding-left: 18pt; }
  li { margin-bottom: 2pt; }
  table { width: 100%; margin: 6pt 0 10pt 0; font-size: 9.5pt; border-collapse: collapse; }
  th, td { border: 1px solid #bbb; padding: 3pt 5pt; text-align: left; }
  th { background: #eee; }
</style>
</head>
<body>
  <h1>{{ title }}</h1>
  <div class="meta">{{ date }} · ABC</div>
  {% if text %}{{ text }}{% endif %}
  {% for f in fields %}
  <h2>{{ f.key }}</h2>
  {{ f.html }}
  {% endfor %}
</body>
</html>
