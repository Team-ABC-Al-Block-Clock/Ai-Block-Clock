# AI Runtime compose.
#
# 백엔드(backend/ai-block-clock/compose.yaml)가 만든 네트워크에 외부 네트워크로
# 참여한다. 그래야 백엔드가 컨테이너 이름으로 우리를 부를 수 있다.
#
#   백엔드에서 본 우리 주소 :  http://ai-block-clock-ai-runtime:8000
#
# 백엔드 compose 는 네트워크에 name 을 주지 않아서 실제 이름에 프로젝트명 접두어가
# 붙는다(`ai-block-clock_ai-block-clock-network`). 환경이 다를 수 있으므로
# BACKEND_NETWORK 로 덮어쓸 수 있게 해 두고, CI 배포 잡이 실제 이름을 찾아 넣는다.
#
# 실행 요청 · 진행 이벤트는 백엔드 compose 의 RabbitMQ(ai-block-clock-rabbitmq)로 주고받고,
# 파일은 백엔드 compose 가 만든 볼륨 두 개를 external 로 마운트해 주고받는다
# (docs/adr/0001-execution-messaging-rabbitmq.md).
#   file-store  백엔드가 쓴 사용자 파일 · 참고 자료. 우리는 읽기만 한다 (계약 3장)
#   results     우리가 쓴 결과물. 백엔드가 읽는다 (계약 5장)
# 볼륨 이름도 네트워크처럼 FILE_STORE_VOLUME · RESULTS_VOLUME 으로 덮어쓸 수 있다.
#
# 운영과 로컬의 차이는 환경변수 몇 개뿐이라 compose.prod.yaml 을 따로 두지 않는다.
#   AI_RUNTIME_BIND  운영은 127.0.0.1 (외부는 Nginx 를 거친다). 로컬 기본값은 0.0.0.0
#   ABC_SERVICE_TOKEN 운영은 반드시 채운다. 비면 인증 검사를 건너뛴다
#   RABBITMQ_USERNAME · RABBITMQ_PASSWORD 운영은 백엔드와 같은 값을 채운다. 로컬 기본값은 guest
#
# 백엔드 compose 를 먼저 up 하면 네트워크 · 볼륨 · RabbitMQ 가 다 생긴다. 백엔드 없이
# 띄울 때는 네트워크와 볼륨을 한 번 만들어 둔다(이때 RabbitMQ 에는 붙지 못한다).
#   docker network create ai-block-clock_ai-block-clock-network
#   docker volume create ai-block-clock_file-store
#   docker volume create ai-block-clock_results

services:
  ai-runtime:
    build:
      # 빌드 컨텍스트는 ai/ 다(Dockerfile 이 spike/linear-mvp · prompts 를 복사한다). ai:build 의
      # `docker build -f Dockerfile ../..` 와 같아야 한다 — 09-22 Dockerfile 만 바꾸고 여기를 안 바꿔
      # 09-26 ai:deploy 가 "/spike/linear-mvp not found" 로 실패했다. 무시 목록은 ai/.dockerignore.
      context: ../..
      dockerfile: spike/linear-mvp/Dockerfile
    image: ai-block-clock-ai-runtime:${IMAGE_TAG:-local}
    container_name: ai-block-clock-ai-runtime
    environment:
      # LLM 은 SSAFY GMS 를 경유한다. 키는 GitLab CI/CD Variables 의 LLM_API_KEY(GMS 팀 키)에서 온다.
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY 가 필요하다}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-pro}
      ABC_SERVICE_TOKEN: ${ABC_SERVICE_TOKEN:-}
      # 실행 메시지 브로커 접속(메시지 계약 10장). 백엔드 compose 의 rabbitmq 를 컨테이너 이름으로 부른다.
      # 계정 변수 이름 · 로컬 기본값은 백엔드 compose 와 같다
      RABBITMQ_HOST: ai-block-clock-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      # 동시에 돌리는 실행 수. 큐 prefetch 로 쓴다
      MAX_ACTIVE_RUNS: ${MAX_ACTIVE_RUNS:-4}
      # 아래 volumes 의 마운트 위치와 같아야 한다
      FILE_STORE_ROOT: /var/lib/ai-block-clock/files
      RESULTS_ROOT: /var/lib/ai-block-clock/results
    volumes:
      - file-store:/var/lib/ai-block-clock/files:ro
      - results:/var/lib/ai-block-clock/results
    ports:
      - "${AI_RUNTIME_BIND:-0.0.0.0}:${AI_RUNTIME_PORT:-8000}:8000"
    networks:
      - ai-block-clock-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  ai-block-clock-network:
    external: true
    name: ${BACKEND_NETWORK:-ai-block-clock_ai-block-clock-network}

# 백엔드 compose 가 만들고 이름을 고정해 둔 볼륨이다. 없으면 compose 가 "external volume not found" 로 멈춘다.
volumes:
  file-store:
    external: true
    name: ${FILE_STORE_VOLUME:-ai-block-clock_file-store}
  results:
    external: true
    name: ${RESULTS_VOLUME:-ai-block-clock_results}
