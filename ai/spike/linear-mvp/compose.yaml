# AI Runtime 단독 실행용 compose.
#
# 백엔드는 backend/ai-block-clock/compose.yaml 에서 MySQL 과 함께 뜨고,
# 그 compose 가 `ai-block-clock-network` 를 만든다. 우리는 그 네트워크에
# 외부 네트워크로 참여해 백엔드가 컨테이너 이름으로 우리를 부를 수 있게 한다.
#
#   백엔드에서 본 우리 주소 :  http://ai-runtime:8000
#
# 실행 (백엔드 compose 가 먼저 떠 있어야 한다)
#   docker compose up -d --build
#
# 네트워크가 아직 없으면 아래로 만든다. 이름은 백엔드 compose 의 프로젝트명에 따라
# 접두어가 붙을 수 있으므로 `docker network ls` 로 실제 이름을 확인할 것.
#   docker network create ai-block-clock-network
#
# ⚠️ 배치 방식은 백엔드와 합의 전이다. 백엔드 compose 에 서비스 블록을 직접 넣는 안도 있다.
#    그 경우 이 파일의 services.ai-runtime 를 그대로 옮기면 된다.

services:
  ai-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-block-clock-ai-runtime:${IMAGE_TAG:-local}
    container_name: ai-block-clock-ai-runtime
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY 가 필요하다}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # 비워 두면 인증 검사를 건너뛴다. 운영에서는 반드시 채운다.
      ABC_SERVICE_TOKEN: ${ABC_SERVICE_TOKEN:-}
    # 로컬 개발에서는 호스트에서 직접 찔러 볼 수 있게 연다.
    # 운영에서는 compose.prod.yaml 이 루프백으로 좁힌다.
    ports:
      - "${AI_RUNTIME_PORT:-8000}:8000"
    networks:
      - ai-block-clock-network
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

networks:
  ai-block-clock-network:
    # 백엔드 compose 가 만든 네트워크에 참여한다.
    # 백엔드보다 먼저 띄우려면 external 을 지우고 driver: bridge 로 바꾼다.
    external: true
