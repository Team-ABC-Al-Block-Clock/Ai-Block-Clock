[project]
name = "linear-mvp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aio-pika>=10.1.1",
    "fastapi>=0.141.1",
    "google-genai>=2.22.0",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "tabulate>=0.10.0",
    "uvicorn>=0.52.4",
    "xhtml2pdf>=0.2.18",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "broker: 실제 RabbitMQ 가 필요한 테스트. RABBITMQ_TEST_URL(amqp://user:pass@host:port/vhost)이 없으면 건너뛴다",
]
