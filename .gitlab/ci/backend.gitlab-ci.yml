# 백엔드 파이프라인 (Gradle 테스트 + Docker Compose 배포)
#
# 트리거: backend/** 가 변경된 경우에만
#
# 빌드·테스트는 JDK 컨테이너에서, 배포는 docker compose 로 한다.
# 호스트에 필요한 것은 Docker 뿐이다 (JDK·JRE 모두 불필요).
#
# Runner: 배포 서버(EC2)에 등록된 shell executor (tags: deploy, shell)

variables:
  BE_DIR: backend/ai-block-clock
  BE_APP_MODULE: core/core-api # 실행 가능한 모듈은 core-api 하나뿐
  BE_JDK_IMAGE: eclipse-temurin:25-jdk
  BE_ENV_FILE: /etc/j15a403/backend.env
  # 컨테이너 안에서 쓸 Gradle 홈. 워크스페이스 안에 두고 GitLab cache 로 재사용한다.
  GRADLE_USER_HOME: .gradle-home

.backend-changes: &backend-changes
  changes:
    - backend/**/*
    - .gitlab/ci/backend.gitlab-ci.yml
    - .gitlab-ci.yml
  exists:
    - backend/ai-block-clock/settings.gradle

backend:build:
  stage: build
  tags:
    - deploy
    - shell
  before_script:
    - chmod +x "$BE_DIR/gradlew"
  script:
    # 호스트 JDK 대신 컨테이너의 JDK 25 를 쓴다.
    # -u 로 현재 사용자 권한을 유지해야 산출물이 root 소유로 남지 않는다.
    - >
      docker run --rm
      -u "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR":/workspace
      -w "/workspace/$BE_DIR"
      -e GRADLE_USER_HOME="/workspace/$GRADLE_USER_HOME"
      "$BE_JDK_IMAGE"
      ./gradlew clean build --no-daemon
    - ls -al "$BE_DIR/$BE_APP_MODULE/build/libs/"
  cache:
    key:
      files:
        - backend/ai-block-clock/settings.gradle
        - backend/ai-block-clock/build.gradle
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/
  artifacts:
    name: "backend-bootjar-$CI_COMMIT_SHORT_SHA"
    paths:
      - backend/ai-block-clock/core/core-api/build/libs/*.jar
    reports:
      junit:
        - backend/ai-block-clock/**/build/test-results/test/TEST-*.xml
    expire_in: 1 week
    when: always # 테스트가 깨져도 리포트는 올린다
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *backend-changes
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|hotfix)\//'
      <<: *backend-changes
    - if: '$CI_COMMIT_BRANCH == "develop-BE"'
      <<: *backend-changes
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *backend-changes

backend:deploy:
  stage: deploy
  tags:
    - deploy
    - shell
  needs:
    # 빌드·테스트 통과를 전제로 하되, jar 는 쓰지 않으므로 artifacts 는 받지 않는다.
    # (이미지는 Dockerfile 멀티스테이지가 소스에서 다시 빌드한다)
    - job: backend:build
      artifacts: false
  script:
    - cd "$BE_DIR"
    # 자격 증명은 서버의 env 파일에만 둔다. 없으면 compose.yaml 의 기본값(local_password)이
    # 그대로 쓰이므로, 배포를 진행하지 않고 실패시킨다.
    - test -f "$BE_ENV_FILE" || { echo "$BE_ENV_FILE 이 없습니다. 문서 2-4 참고"; exit 1; }
    - grep -q '^MYSQL_PASSWORD=' "$BE_ENV_FILE" || { echo "MYSQL_PASSWORD 미설정"; exit 1; }
    - >
      docker compose --env-file "$BE_ENV_FILE"
      -f compose.yaml -f compose.prod.yaml
      up -d --build --remove-orphans
    - docker compose -f compose.yaml -f compose.prod.yaml ps
    # compose 의 healthcheck 가 UP 이 될 때까지 기다린다
    - |
      for i in $(seq 1 40); do
        if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
          echo "health OK"
          docker image prune -f
          exit 0
        fi
        sleep 3
      done
      echo "헬스체크 실패 — 컨테이너 로그:"
      docker compose -f compose.yaml -f compose.prod.yaml logs --tail=100 backend
      exit 1
  environment:
    name: production/backend
    url: https://j15a403.p.ssafy.io/api
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *backend-changes
      when: manual # DB 자격 증명 준비 전까지 수동. 준비되면 이 줄을 지운다
