variables:
  BE_DIR: backend/ai-block-clock
  BE_APP_MODULE: core/core-api
  BE_JDK_IMAGE: eclipse-temurin:25-jdk
  GRADLE_USER_HOME: .gradle-home

.backend-gradle:
  tags:
    - deploy
    - shell
  before_script:
    - chmod +x "$BE_DIR/gradlew"
  cache:
    key:
      files:
        - backend/ai-block-clock/settings.gradle
        - backend/ai-block-clock/build.gradle
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/

.backend-changes: &backend-changes
  changes:
    - backend/**/*
    - .gitlab/ci/backend.gitlab-ci.yml
    - .gitlab-ci.yml
  exists:
    - backend/ai-block-clock/settings.gradle

backend:build:
  extends: .backend-gradle
  stage: build
  script:
    - >
      docker run --rm
      -u "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR":/workspace
      -w "/workspace/$BE_DIR"
      -e GRADLE_USER_HOME="/workspace/$GRADLE_USER_HOME"
      "$BE_JDK_IMAGE"
      ./gradlew clean build --no-daemon
    - ls -al "$BE_DIR/$BE_APP_MODULE/build/libs/"
  artifacts:
    name: "backend-bootjar-$CI_COMMIT_SHORT_SHA"
    paths:
      - backend/ai-block-clock/core/core-api/build/libs/*.jar
    reports:
      junit:
        - backend/ai-block-clock/**/build/test-results/test/TEST-*.xml
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *backend-changes
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|hotfix)\//'
      <<: *backend-changes
    - if: '$CI_COMMIT_BRANCH == "develop-BE"'
      <<: *backend-changes
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *backend-changes

backend:test:integration:
  extends: .backend-gradle
  stage: test
  needs:
    - job: backend:build
      artifacts: false
  script:
    - >
      docker run --rm
      -u "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR":/workspace
      -w "/workspace/$BE_DIR"
      -e GRADLE_USER_HOME="/workspace/$GRADLE_USER_HOME"
      "$BE_JDK_IMAGE"
      ./gradlew integrationTest --no-daemon
  artifacts:
    reports:
      junit:
        - backend/ai-block-clock/**/build/test-results/integrationTest/TEST-*.xml
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *backend-changes
    - if: '$CI_COMMIT_BRANCH == "develop-BE"'
      <<: *backend-changes
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *backend-changes

backend:test:mysql:
  extends: .backend-gradle
  stage: test
  needs:
    - job: backend:build
      artifacts: false
  resource_group: backend-mysql-tests
  script:
    - test -S /var/run/docker.sock
    - >
      docker run --rm
      -u "$(id -u):$(id -g)"
      --group-add "$(stat -c '%g' /var/run/docker.sock)"
      --network=host
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$CI_PROJECT_DIR":"$CI_PROJECT_DIR"
      -w "$CI_PROJECT_DIR/$BE_DIR"
      -e GRADLE_USER_HOME="$CI_PROJECT_DIR/$GRADLE_USER_HOME"
      -e TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1
      "$BE_JDK_IMAGE"
      ./gradlew containerTest --no-daemon --console=plain --rerun-tasks
  artifacts:
    reports:
      junit:
        - backend/ai-block-clock/**/build/test-results/containerTest/TEST-*.xml
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *backend-changes
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "develop-BE" || $CI_COMMIT_BRANCH == "master"'
      <<: *backend-changes
      when: manual
      allow_failure: true

backend:deploy:
  stage: deploy
  tags:
    - deploy
    - shell
  needs:
    - job: backend:build
      artifacts: true
    - job: backend:test:integration
      artifacts: false
  script:
    - cd "$BE_DIR"
    - |
      if ! ls "$BE_APP_MODULE"/build/libs/*.jar >/dev/null 2>&1; then
        echo "$BE_APP_MODULE/build/libs/ 에 jar 가 없습니다."
        echo "backend:build 의 artifacts 가 내려왔는지 확인하세요 (needs.artifacts: true)."
        exit 1
      fi
    - |
      for v in MYSQL_DATABASE MYSQL_USER MYSQL_PASSWORD MYSQL_ROOT_PASSWORD RABBITMQ_USERNAME RABBITMQ_PASSWORD; do
        eval "val=\$$v"
        if [ -z "$val" ]; then
          echo "$v 가 비어 있습니다. GitLab > Settings > CI/CD > Variables 를 확인하세요."
          echo "(Protected 로 설정한 변수는 보호 브랜치에서만 주입됩니다)"
          exit 1
        fi
      done
    - >
      docker compose
      -f compose.yaml -f compose.prod.yaml
      up -d --build --remove-orphans
    - docker compose -f compose.yaml -f compose.prod.yaml ps
    - |
      for i in $(seq 1 40); do
        if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
          echo "health OK"
          docker image prune -f
          exit 0
        fi
        sleep 3
      done
      echo "헬스체크 실패 — 컨테이너 로그:"
      docker compose -f compose.yaml -f compose.prod.yaml logs --tail=100 backend
      exit 1
  environment:
    name: production/backend
    url: https://j15a403.p.ssafy.io/api
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *backend-changes
