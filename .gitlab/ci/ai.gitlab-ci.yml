# AI 파이프라인 (Docker 이미지 빌드 + 스모크 테스트 + Compose 배포)
#
# 트리거: ai/** 가 변경된 경우에만
#
# 백엔드와 달리 컴파일 산출물이 없다. 파이썬이라 artifacts 로 넘길 jar 가 없고,
# 대신 빌드한 이미지 자체를 그대로 다음 잡에서 쓴다. Runner 가 배포 서버에 직접
# 등록된 shell executor 라서 잡 사이에 로컬 이미지가 남아 있기 때문이다.
#
#   ai:build   이미지 빌드. Dockerfile·의존성·한글 폰트 설치가 깨지면 여기서 잡힌다
#   ai:test    mock 모드로 파이프라인 전체를 돌려 PDF 가 나오는지 확인. LLM 호출 없음
#   ai:deploy  compose up. develop-AI · master 에서 수동 실행 (MVP 기간 한정, 프리즈 후 master 만)
#
# 백엔드는 AI Runtime 을 같은 Docker 네트워크에서 컨테이너 이름으로 부른다.
# 브라우저가 직접 부르지 않으므로 Nginx 설정은 필요 없다.
#
#   백엔드 → http://ai-block-clock-ai-runtime:8000
#
# Runner: 배포 서버(EC2)에 등록된 shell executor (tags: deploy, shell)

variables:
  AI_DIR: ai/spike/linear-mvp
  AI_IMAGE: ai-block-clock-ai-runtime

.ai-changes: &ai-changes
  changes:
    - ai/**/*
    - .gitlab/ci/ai.gitlab-ci.yml
    - .gitlab-ci.yml
  exists:
    - ai/spike/linear-mvp/Dockerfile

.ai-runner:
  tags:
    - deploy
    - shell

ai:build:
  extends: .ai-runner
  stage: build
  script:
    - cd "$AI_DIR"
    # 커밋 태그와 latest 를 함께 붙인다. deploy 가 latest 를 쓴다.
    # 빌드 컨텍스트는 ai/ (../..) 다 — 공용 프롬프트 ai/prompts 를 이미지에 넣기 위해서.
    # 무시 목록은 ai/.dockerignore.
    - docker build -f Dockerfile -t "$AI_IMAGE:$CI_COMMIT_SHORT_SHA" -t "$AI_IMAGE:latest" ../..
    # 블록 스칼라로 감싼다. 'image size: {{…}}' 의 "콜론+공백"을 YAML 이 키로 읽어 파싱이 깨지기 때문이다.
    - |
      docker image inspect "$AI_IMAGE:$CI_COMMIT_SHORT_SHA" --format 'image size: {{.Size}} bytes'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *ai-changes
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|hotfix)\//'
      <<: *ai-changes
    - if: '$CI_COMMIT_BRANCH == "develop-AI"'
      <<: *ai-changes
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *ai-changes

ai:test:
  extends: .ai-runner
  stage: test
  needs:
    - job: ai:build
      artifacts: false
  script:
    # mock 모드는 LLM 을 호출하지 않는다. 무료 등급 요청 상한을 CI 가 소모하지 않고,
    # 키 없이도 돌기 때문에 MR 파이프라인에서 안전하게 쓸 수 있다.
    # 엑셀 파싱 → 노드 순차 실행 → 마크다운 → PDF 까지 실제 코드가 전부 돈다.
    #
    # 데모 엑셀(data/*.xlsx)은 gitignore 대상이라 이미지에 없다. 먼저 생성한다.
    # 그 뒤 PDF 가 실제로 만들어졌고 한글 폰트가 임베딩됐는지 확인한다.
    # Linux 이미지에 폰트가 빠지면 여기서 잡힌다.
    - >
      docker run --rm
      -e LLM_API_KEY=ci-smoke-test
      --entrypoint sh
      "$AI_IMAGE:$CI_COMMIT_SHORT_SHA"
      -c '
      set -e &&
      uv run python data/make_demo_data.py &&
      test -s data/demo_scores.xlsx &&
      uv run python -m src.runner --workflow report --file data/demo_scores.xlsx --comment "CI 스모크 테스트" --mock &&
      test -s /prompts/brand/01_market_research.md &&
      uv run python -m src.runner --workflow brand_agent --input data/brand_brief.json --comment "CI 스모크 테스트" --mock &&
      PDF=$(find out -name report.pdf | head -1) &&
      test -s "$PDF" &&
      grep -q FontFile2 "$PDF" &&
      echo "PDF OK: $PDF ($(wc -c < "$PDF") bytes, 폰트 임베딩됨)"
      '
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *ai-changes
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|hotfix)\//'
      <<: *ai-changes
    - if: '$CI_COMMIT_BRANCH == "develop-AI"'
      <<: *ai-changes
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *ai-changes

ai:deploy:
  extends: .ai-runner
  stage: deploy
  needs:
    - job: ai:build
      artifacts: false
    - job: ai:test
      artifacts: false
  script:
    # 자격 증명은 GitLab CI/CD Variables 에서 온다.
    # compose.yaml 이 ${ABC_SERVICE_TOKEN:-} 처럼 기본값을 갖고 있어서 변수가 비면
    # 인증 없이 조용히 뜬다. 그 전에 잡는다.
    # RABBITMQ_* 도 같다. 비면 로컬 기본값 guest 로 떠서 운영 브로커에 붙지 못한다.
    - |
      for v in LLM_API_KEY ABC_SERVICE_TOKEN RABBITMQ_USERNAME RABBITMQ_PASSWORD; do
        eval "val=\$$v"
        if [ -z "$val" ]; then
          echo "$v 가 비어 있습니다. GitLab > Settings > CI/CD > Variables 를 확인하세요."
          echo "(Protected 로 설정한 변수는 보호 브랜치에서만 주입됩니다)"
          exit 1
        fi
      done
    # 백엔드 compose 가 만든 네트워크에 참여한다. 네트워크에 name 이 없어 실제
    # 이름에 프로젝트명 접두어가 붙으므로, 고정하지 않고 찾아서 쓴다.
    - |
      if [ -z "$BACKEND_NETWORK" ]; then
        BACKEND_NETWORK=$(docker network ls --format '{{.Name}}' | grep -E 'ai-block-clock.*network' | head -1)
      fi
      if [ -z "$BACKEND_NETWORK" ]; then
        echo "백엔드 Docker 네트워크를 찾지 못했습니다. 백엔드가 먼저 배포되어야 합니다."
        echo "현재 네트워크 목록:"
        docker network ls
        echo "이름이 다르면 CI/CD Variables 에 BACKEND_NETWORK 를 지정하세요."
        exit 1
      fi
      echo "백엔드 네트워크: $BACKEND_NETWORK"
      export BACKEND_NETWORK
    # 백엔드 compose 가 만든 file-store · results 볼륨을 external 로 마운트한다(ADR-0001).
    # 결과 볼륨은 RabbitMQ 와 함께 들어간 백엔드가 master 에 배포되어야 생긴다. 없으면 compose 가
    # "external volume not found" 로 멈추므로 먼저 확인하고 이유를 남긴다.
    - |
      for vol in "${FILE_STORE_VOLUME:-ai-block-clock_file-store}" "${RESULTS_VOLUME:-ai-block-clock_results}"; do
        if ! docker volume inspect "$vol" >/dev/null 2>&1; then
          echo "Docker 볼륨 $vol 이 없습니다. 백엔드(RabbitMQ · 결과 볼륨 포함)가 먼저 배포되어야 합니다."
          echo "현재 볼륨 목록:"
          docker volume ls
          echo "이름이 다르면 CI/CD Variables 에 FILE_STORE_VOLUME · RESULTS_VOLUME 을 지정하세요."
          exit 1
        fi
      done
    - cd "$AI_DIR"
    # 외부는 Nginx 를 거치지 않는다. 백엔드만 부르므로 루프백에만 바인딩한다.
    - export AI_RUNTIME_BIND=127.0.0.1
    - export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - docker compose up -d --build --remove-orphans
    - docker compose ps
    # compose 의 healthcheck 가 UP 이 될 때까지 기다린다
    - |
      for i in $(seq 1 40); do
        if curl -fsS http://127.0.0.1:8000/v1/health | grep -q '"status":"ok"'; then
          echo "health OK"
          curl -fsS http://127.0.0.1:8000/v1/health
          docker image prune -f
          exit 0
        fi
        sleep 3
      done
      echo "헬스체크 실패 — 컨테이너 로그:"
      docker compose logs --tail=100 ai-runtime
      exit 1
  environment:
    name: production/ai-runtime
    # 외부에 노출하지 않는다. 백엔드가 내부 네트워크로만 부른다.
    url: http://ai-block-clock-ai-runtime:8000
  rules:
    # develop-AI 에서도 수동 배포를 허용한다. MVP 기간에는 master 병합 전에 백엔드·프론트가
    # 붙어 볼 Runtime 이 EC2 에 있어야 하기 때문이다. 같은 서버·같은 컨테이너 이름을 쓰므로
    # develop-AI 배포와 master 배포는 서로를 덮어쓴다. 코드 프리즈 후에는 master 만 남긴다.
    - if: '$CI_COMMIT_BRANCH == "develop-AI"'
      <<: *ai-changes
      when: manual
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *ai-changes
      when: manual # 키 준비 전까지 수동. 준비되면 이 줄을 지운다
