variables:
  FE_DIR: frontend
  FE_DEPLOY_PATH: /var/www/j15a403/frontend
  FE_NODE_IMAGE: node:24

.frontend-changes: &frontend-changes
  changes:
    - frontend/**/*
    - .gitlab/ci/frontend.gitlab-ci.yml
    - .gitlab-ci.yml
  exists:
    - frontend/package.json

frontend:build:
  stage: build
  tags:
    - deploy
    - shell
  script:
    - >
      docker run --rm
      -u "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR":/workspace
      -w "/workspace/$FE_DIR"
      -e HOME=/workspace/.npm-home
      -e npm_config_cache=/workspace/.npm-cache
      "$FE_NODE_IMAGE"
      sh -c "npm ci && npm run lint && npm run build"
    - test -f "$FE_DIR/dist/index.html"
    - ls -al "$FE_DIR/dist/"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm-cache/
      - frontend/node_modules/
  artifacts:
    name: "frontend-dist-$CI_COMMIT_SHORT_SHA"
    paths:
      - frontend/dist/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *frontend-changes
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|hotfix)\//'
      <<: *frontend-changes
    - if: '$CI_COMMIT_BRANCH == "develop-FE"'
      <<: *frontend-changes
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *frontend-changes

frontend:test:
  stage: test
  tags:
    - deploy
    - shell
  needs:
    - job: frontend:build
      artifacts: false
  script:
    - >
      docker run --rm
      -u "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR":/workspace
      -w "/workspace/$FE_DIR"
      -e HOME=/workspace/.npm-home
      -e npm_config_cache=/workspace/.npm-cache
      "$FE_NODE_IMAGE"
      sh -c "npm ci && npm run test -- --reporter=default --reporter=junit --outputFile.junit=test-results/junit.xml"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm-cache/
      - frontend/node_modules/
    policy: pull
  artifacts:
    reports:
      junit:
        - frontend/test-results/junit.xml
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      <<: *frontend-changes
    - if: '$CI_COMMIT_BRANCH =~ /^(feat|hotfix)\//'
      <<: *frontend-changes
    - if: '$CI_COMMIT_BRANCH == "develop-FE"'
      <<: *frontend-changes
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *frontend-changes

frontend:deploy:
  stage: deploy
  tags:
    - deploy
    - shell
  needs:
    - frontend:build
    - job: frontend:test
      artifacts: false
  script:
    - mkdir -p "$FE_DEPLOY_PATH"
    - rsync -av --delete "$FE_DIR/dist/" "$FE_DEPLOY_PATH/"
    - ls -al "$FE_DEPLOY_PATH/index.html"
  environment:
    name: production/frontend
    url: https://j15a403.p.ssafy.io
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      <<: *frontend-changes
