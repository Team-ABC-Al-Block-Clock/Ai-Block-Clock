stages:
  - build
  - test
  - deploy

variables:
  GIT_DEPTH: '20'

include:
  - local: .gitlab/ci/frontend.gitlab-ci.yml
  - local: .gitlab/ci/backend.gitlab-ci.yml
  - local: .gitlab/ci/ai.gitlab-ci.yml

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
