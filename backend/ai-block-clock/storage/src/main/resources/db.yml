# storage 모듈이 소유하는 DB 설정. 프로파일별 값은 db-{profile}.yml 에서 덮어쓴다.
# core-api 의 application.yaml 이 spring.config.import 로 가져간다.
spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # 스키마 변경은 Flyway 마이그레이션으로만 한다
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
