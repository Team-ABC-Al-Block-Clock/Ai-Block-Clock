# 테스트에서만 main 의 application.yaml 위에 덮어쓴다. classpath:/config/ 는 Spring Boot 가 함께 읽는 위치다.
# 대기 중인 충전을 뒤에서 재확인하면 실제 체인에 요청이 나가고, 테스트가 만든 충전 요청을 건드린다.
payment:
  charge:
    polling-enabled: false

# 끝나지 않은 실행을 뒤에서 다시 붙잡으면 테스트가 만든 실행을 엔진에 묻거나 닫아 버린다. 복구 자체는 단위 테스트로 본다.
# 넘기지 않은 실행의 주기 발행 · 감시 점검도 테스트가 만든 실행을 건드리므로 테스트 동안에는 돌지 않을 만큼 늦춘다.
execution:
  recovery:
    enabled: false
  evidence:
    backfill-enabled: false
  dispatch:
    interval: 1h
  watch:
    interval: 1h

# 통합 테스트에는 브로커가 없다. 리스너가 붙으려다 기동이 늦어지거나 실패하지 않게 시작하지 않는다.
# 브로커가 있어야 하는 것은 @Tag("container") 테스트가 리스너를 켜고 본다.
spring:
  rabbitmq:
    listener:
      simple:
        auto-startup: false
