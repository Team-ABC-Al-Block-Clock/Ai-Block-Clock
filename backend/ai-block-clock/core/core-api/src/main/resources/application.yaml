# core-api 는 애플리케이션 조립만 담당한다.
# 각 모듈의 설정은 해당 모듈이 소유하고, 여기서는 가져오기만 한다.
spring:
  application:
    name: ai-block-clock
  profiles:
    default: local
  config:
    import:
      - classpath:db.yml           # :storage
      - classpath:monitoring.yml   # :support:monitoring
      - classpath:blockchain.yml   # :client:blockchain
      - classpath:ai.yml           # :client:ai
  session:
    timeout: ${AUTH_SESSION_TIMEOUT:2h}
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        path: /api/v1
        secure: ${AUTH_COOKIE_SECURE:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

# 기한 = 단계 수 × per-step + grace. 엔진 계약 v2.0 10장의 폴링 중단 기준이다.
# 기본 모델이 gemini-2.5-pro 로 바뀌며(09-26) 노드당 최대 32초가 재져 단계당 40초에서 60초로 올랐다.
execution:
  polling:
    workers: ${EXECUTION_POLL_WORKERS:4}
    interval: ${EXECUTION_POLL_INTERVAL:2s}
    per-step: ${EXECUTION_POLL_PER_STEP:60s}
    grace: ${EXECUTION_POLL_GRACE:60s}

file-store:
  root: ${FILE_STORE_ROOT:/var/lib/ai-block-clock/files}

# 등급 지표(PAY-016 ~ 018) 수식의 조정값. AI grading-formula.md v1.0 의 초기값이고 팀 합의로 바뀔 수 있다.
agent-grade:
  rating-prior-count: ${AGENT_GRADE_RATING_PRIOR_COUNT:10}
  rating-prior-mean: ${AGENT_GRADE_RATING_PRIOR_MEAN:3.5}
  usage-cap: ${AGENT_GRADE_USAGE_CAP:1000}
  success-rate-exponent: ${AGENT_GRADE_SUCCESS_RATE_EXPONENT:2}

wallet-auth:
  domain: ${WALLET_AUTH_DOMAIN:j15a403.p.ssafy.io}
  uri: ${WALLET_AUTH_URI:https://j15a403.p.ssafy.io/}
  chain-id: ${WALLET_AUTH_CHAIN_ID:80002}
  message-ttl: ${WALLET_AUTH_MESSAGE_TTL:5m}
