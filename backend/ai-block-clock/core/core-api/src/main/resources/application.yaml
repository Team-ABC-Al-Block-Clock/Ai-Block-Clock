# core-api 는 애플리케이션 조립만 담당한다.
# 각 모듈의 설정은 해당 모듈이 소유하고, 여기서는 가져오기만 한다.
spring:
  application:
    name: ai-block-clock
  profiles:
    default: local
  config:
    import:
      - classpath:db.yml           # :storage
      - classpath:monitoring.yml   # :support:monitoring
  session:
    timeout: ${AUTH_SESSION_TIMEOUT:2h}
    jdbc:
      initialize-schema: never

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        path: /api/v1
        secure: ${AUTH_COOKIE_SECURE:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

wallet-auth:
  domain: ${WALLET_AUTH_DOMAIN:j15a403.p.ssafy.io}
  uri: ${WALLET_AUTH_URI:https://j15a403.p.ssafy.io/}
  chain-id: ${WALLET_AUTH_CHAIN_ID:80002}
  message-ttl: ${WALLET_AUTH_MESSAGE_TTL:5m}

ssafy:
  sto:
    base-url: ${SSAFY_STO_BASE_URL:https://sto.ssafy.io}
    connect-timeout: ${SSAFY_STO_CONNECT_TIMEOUT:3s}
    read-timeout: ${SSAFY_STO_READ_TIMEOUT:10s}
    transaction-timeout: ${SSAFY_STO_TRANSACTION_TIMEOUT:60s}
    token:
      contract-address: ${SSAFY_TOKEN_CONTRACT_ADDRESS:}
    mint:
      requestor-address: ${SSAFY_TOKEN_MINT_REQUESTOR:}
      recipient-address: ${SSAFY_TOKEN_MINT_RECIPIENT:}
      value: ${SSAFY_TOKEN_MINT_VALUE:}
      data: ${SSAFY_TOKEN_MINT_DATA:}
      signature: ${SSAFY_TOKEN_MINT_SIGNATURE:}
      confirmation: ${SSAFY_TOKEN_MINT_CONFIRM:}
    deployment:
      owner-address: ${SSAFY_TOKEN_OWNER_ADDRESS:}
      confirmation: ${SSAFY_TOKEN_DEPLOY_CONFIRM:}
