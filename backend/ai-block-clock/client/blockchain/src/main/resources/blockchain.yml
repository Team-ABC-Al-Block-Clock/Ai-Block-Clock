# :client:blockchain 이 소유하는 설정이다. core-api 는 application.yaml 에서 가져오기만 한다.
# 체인에 쓰는 일은 출금 지급 하나뿐이다. 보관 지갑이 서명한 전송을 RPC 로 보낸다.
ssafy:
  sto:
    base-url: ${SSAFY_STO_BASE_URL:https://sto.ssafy.io}
    connect-timeout: ${SSAFY_STO_CONNECT_TIMEOUT:3s}
    read-timeout: ${SSAFY_STO_READ_TIMEOUT:10s}
    token:
      # abcToken. SSAFY 토큰증권 API 로 배포했고 name · symbol 로 확인했다
      contract-address: ${SSAFY_TOKEN_CONTRACT_ADDRESS:0x56DC097C14836473f4Ad4BD675a3d01BE5e4C63c}
  chain:
    # SSAFY 체인 노드의 HTTPS JSON-RPC. 문서에는 wss 주소만 있고, 이 주소는 직접 호출해 같은 체인(31221)임을 확인했다
    rpc-url: ${SSAFY_CHAIN_RPC_URL:https://rpc.ssafy-blockchain.com}
    connect-timeout: ${SSAFY_CHAIN_CONNECT_TIMEOUT:3s}
    read-timeout: ${SSAFY_CHAIN_READ_TIMEOUT:10s}
    signer:
      # 출금을 보내는 보관 지갑의 개인키. 서버의 backend.env 에만 적는다. 비우면 서명하지 않는다
      private-key: ${SSAFY_CHAIN_SIGNER_PRIVATE_KEY:}
