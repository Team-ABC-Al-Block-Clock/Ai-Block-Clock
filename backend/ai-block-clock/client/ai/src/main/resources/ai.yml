# :client:ai 가 소유하는 설정이다. core-api 는 application.yaml 에서 가져오기만 한다.
# AI 파트 서비스는 같은 도커 네트워크 안에서만 닿는다. 토큰이 비어 있으면 헤더를 붙이지 않는다.
ai:
  recommend:
    base-url: ${AI_RECOMMEND_BASE_URL:http://ai-block-clock-recommend:8100}
    service-token: ${ABC_SERVICE_TOKEN:}
    connect-timeout: ${AI_RECOMMEND_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_RECOMMEND_READ_TIMEOUT:5s}
