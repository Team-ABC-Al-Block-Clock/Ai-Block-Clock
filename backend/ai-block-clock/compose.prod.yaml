# 운영 서버 override. compose.yaml 위에 겹쳐서 쓴다.
#
#   docker compose --env-file /etc/j15a403/backend.env \
#     -f compose.yaml -f compose.prod.yaml up -d --build
#
# compose.yaml 은 로컬 개발 기준(dev 프로파일, MySQL 호스트 노출)이므로
# 운영에서 달라져야 하는 값만 여기서 덮어쓴다.

services:
  mysql:
    ports: !override
      - "127.0.0.1:3306:3306"
    restart: unless-stopped

  rabbitmq:
    environment:
      # 운영 계정은 기본값을 두지 않는다. 비어 있으면 compose 가 아무것도 띄우기 전에 멈춘다.
      # 백엔드 · 런타임도 같은 RABBITMQ_USERNAME · RABBITMQ_PASSWORD 를 받는다
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?RABBITMQ_USERNAME 가 필요하다}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 가 필요하다}
    # 5672 는 열지 않는다. 백엔드 · 런타임은 도커 네트워크로 붙는다.
    # 관리 UI 는 루프백에만 묶는다. 볼 때는 SSH 터널(ssh -L 15672:127.0.0.1:15672)로 본다
    ports: !override
      - "127.0.0.1:15672:15672"
    restart: unless-stopped

  backend:
    # prod target: CI(backend:build)가 테스트까지 끝낸 jar 를 그대로 이미지에 넣는다.
    # 컨테이너 안에서 재컴파일하지 않는다.
    build:
      target: prod
    image: ai-block-clock-backend:${IMAGE_TAG:-latest}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      WALLET_AUTH_DOMAIN: ${WALLET_AUTH_DOMAIN:-j15a403.p.ssafy.io}
      WALLET_AUTH_URI: ${WALLET_AUTH_URI:-https://j15a403.p.ssafy.io/}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      # 관리자가 Swagger 로 심사한다. 심사가 필요 없어지면 false 로 끈다
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    # 8080 을 0.0.0.0 이 아니라 루프백에만 바인딩한다. 외부는 Nginx 를 거친다.
    ports: !override
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
