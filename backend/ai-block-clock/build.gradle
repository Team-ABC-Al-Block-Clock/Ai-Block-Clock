plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    // 1.15.0 은 Gradle 9 에서 깨진다(없어진 reporting.baseDir 을 참조). 1.19.0 부터 동작한다.
    id 'info.solidsoft.pitest' version '1.19.0' apply false
}

allprojects {
    group = 'com.aiblockclock'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

// core 처럼 하위 모듈만 묶는 wrapper 프로젝트는 제외하고, 실제 소스를 갖는 모듈만 설정한다.
configure(subprojects.findAll { it.subprojects.isEmpty() }) {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'info.solidsoft.pitest'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    // 단위 테스트. @Tag("integration") 이 붙은 것은 제외한다.
    // MR 마다 도는 태스크이므로 외부 의존(DB, 컨테이너, 네트워크)이 없어야 한다.
    tasks.named('test') {
        useJUnitPlatform {
            excludeTags 'integration', 'container'
        }
    }

    // 통합 테스트. @Tag("integration") 이 붙은 것만 실행한다.
    // 소스셋을 나누지 않고 태그로 가른다 — 의존성 선언이 중복되지 않고,
    // 테스트를 옮기지 않아도 태그만 붙이면 분류가 바뀐다.
    tasks.register('integrationTest', Test) {
        group = 'verification'
        description = '@Tag("integration") 이 붙은 테스트만 실행한다.'

        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath

        useJUnitPlatform {
            includeTags 'integration'
            excludeTags 'container'
        }

        // 설정이 다른 @SpringBootTest 마다 컨텍스트(H2 DB · Hibernate 메타모델 포함)를 하나씩 캐시해 둔다.
        // 기본 힙(512MB)으로는 마지막 클래스들에서 OutOfMemoryError 가 났다.
        maxHeapSize = '1g'

        shouldRunAfter tasks.named('test')
    }

    tasks.register('containerTest', Test) {
        group = 'verification'
        description = '@Tag("container") 테스트를 실제 MySQL 컨테이너에서 실행한다.'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags 'container'
        }
        shouldRunAfter tasks.named('integrationTest')
    }

    // 돌연변이 테스트. 단위 테스트만으로 돌연변이를 잡는지 본다 — 컨텍스트를 띄우는 테스트는 돌연변이마다 다시 돌기엔 느리다.
    // 범위는 -PpitTargetClasses=패턴,패턴 으로 좁힌다. 지정하지 않으면 모듈 전체다.
    // 결과는 build/reports/pitest/mutations.xml 에 남는다.
    pitest {
        pitestVersion = '1.30.1'
        junit5PluginVersion = '1.2.3'
        targetClasses = (findProperty('pitTargetClasses') ?: "${project.group}.*").split(',') as List
        // 테스트는 늘 모듈 전체에서 고른다. 비워 두면 플러그인이 targetClasses 를 그대로 써, 범위를 좁히면 *Test 가 하나도 뽑히지 않고 0% 가 된다.
        targetTests = ["${project.group}.*"]
        excludedGroups = ['integration', 'container']
        threads = Runtime.runtime.availableProcessors()
        outputFormats = ['XML', 'HTML']
        timestampedReports = false
    }
}
